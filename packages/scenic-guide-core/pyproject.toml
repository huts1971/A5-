[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scenic-guide-core"
version = "0.1.0"
description = "Independent Agentic RAG, SFT and memory core for LingShiYin"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "SQLAlchemy>=2.0.36,<3",
  "langgraph>=1.0,<2", "rank-bm25>=0.2.2,<0.3", "jieba>=0.42.1,<0.43",
  "filelock>=3.16,<4", "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
ingest = ["beautifulsoup4>=4.12,<5", "pdfplumber>=0.11,<1", "python-docx>=1.1,<2"]
retrieval = ["pymilvus>=2.5,<2.7", "sentence-transformers>=5,<6"]
train = ["torch>=2.6,<3", "transformers>=4.51,<5", "peft>=0.15,<1", "datasets>=3.5,<4", "accelerate>=1.6,<2"]
quant = ["bitsandbytes>=0.45,<1"]
eval = ["ragas>=0.3,<0.4", "langchain-openai>=0.3,<0.4", "nltk>=3.9,<4"]
mysql = ["pymysql>=1.1,<2"]

[project.scripts]
scenic-core = "scenic_guide_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
